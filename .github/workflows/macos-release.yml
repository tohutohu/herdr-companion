name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Compose Multiplatform 1.12.0 supports macOS arm64 for this project.
    runs-on: macos-14
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          VERSION="$(awk -F= '$1 == "version" { print $2; exit }' version.properties)"
          BUILD="${GITHUB_RUN_NUMBER:-$(awk -F= '$1 == "build" { print $2; exit }' version.properties)}"

          if [[ -z "$VERSION" || -z "$BUILD" ]]; then
            echo "version.properties must define version and build." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Git tag $GITHUB_REF_NAME does not match version.properties ($VERSION)." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (build $BUILD)"

      - name: Run Android and shared regression checks
        working-directory: android
        run: ./gradlew --console=plain test assembleDebug

      - name: Run Gateway regression checks
        working-directory: gateway
        run: |
          env -u GOROOT go test ./...
          env -u GOROOT go vet ./...

      - name: Build Android release APK
        working-directory: android
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUILD: ${{ steps.release.outputs.build }}
        run: |
          ./gradlew --console=plain :app:assembleRelease \
            "-Pherdr.version=$VERSION" \
            "-Pherdr.build=$BUILD"

          mkdir -p ../dist
          APK="app/build/outputs/apk/release/app-release.apk"
          OUTPUT="../dist/Herdr-Companion-Android-$VERSION.apk"
          [[ -f "$APK" ]] || { echo "Missing release APK: $APK" >&2; exit 1; }
          cp "$APK" "$OUTPUT"
          (cd ../dist && shasum -a 256 "$(basename "$OUTPUT")" > "$(basename "$OUTPUT").sha256")

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "${MACOS_CERTIFICATE_P12_BASE64:-}" || -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "Developer ID certificate secrets are not configured; producing an unsigned local-style artifact."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/herdr-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/herdr-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "No Developer ID Application identity was found in the imported keychain." >&2
            exit 1
          fi

          {
            echo "MACOS_SIGNING_IDENTITY=$IDENTITY"
            echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN_PATH"
            echo "HERDR_CI_KEYCHAIN=$KEYCHAIN_PATH"
          } >> "$GITHUB_ENV"

      - name: Build and verify separate macOS DMGs
        run: ./scripts/build-macos-release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Herdr-release-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            dist/Herdr-*.dmg
            dist/Herdr-*.dmg.sha256
            dist/Herdr-*.apk
            dist/Herdr-*.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          ASSETS=(
            "dist/Herdr-$VERSION.dmg"
            "dist/Herdr-$VERSION.dmg.sha256"
            "dist/Herdr-Companion-$VERSION.dmg"
            "dist/Herdr-Companion-$VERSION.dmg.sha256"
            "dist/Herdr-Companion-Android-$VERSION.apk"
            "dist/Herdr-Companion-Android-$VERSION.apk.sha256"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
              --verify-tag --generate-notes
          fi

      - name: Delete temporary keychain
        if: always()
        run: |
          if [[ -n "${HERDR_CI_KEYCHAIN:-}" ]]; then
            security delete-keychain "$HERDR_CI_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/herdr-developer-id.p12"
